<article
  class="group cursor-pointer overflow-hidden rounded-[26px] bg-white p-3 transition-colors duration-300"
  (click)="onViewDetails()"
  (keydown.enter)="onViewDetails()"
  tabindex="0"
  role="button"
  [attr.aria-label]="'Voir ' + property().title"
>
  <div class="relative aspect-[1.24] overflow-hidden rounded-[22px] bg-rheo-bg">
    <img
      [src]="property().imageUrl"
      [alt]="property().title"
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
    />

    @if (property().verified) {
      <span class="absolute right-4 top-4 rounded-full bg-white px-4 py-2 text-xs font-bold text-rheo-dark shadow-[0_8px_22px_rgba(16,24,18,0.12)]">
        Vérifié
      </span>
    }
  </div>

  <div class="px-0 pb-0 pt-5">
    <div class="flex items-start justify-between gap-4">
      <h3 class="min-w-0 text-lg font-bold leading-snug text-rheo-dark">{{ property().title }}</h3>
      <p class="shrink-0 whitespace-nowrap text-base font-bold text-[#c79a55]">
        {{ property().price | propertyPrice: property().priceSuffix }}
      </p>
    </div>

    <p class="mt-3 flex items-center gap-2 text-sm text-rheo-muted">
      <svg class="h-4 w-4 text-[#c79a55]" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 21s7-5.3 7-12a7 7 0 1 0-14 0c0 6.7 7 12 7 12Z" stroke="currentColor" stroke-width="1.8" />
        <path d="M12 11.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" stroke="currentColor" stroke-width="1.8" />
      </svg>
      {{ property().location }}
    </p>

    <div class="my-5 h-px bg-rheo-border"></div>

    <div class="flex flex-wrap items-center gap-6 text-sm text-rheo-muted">
      <span class="flex items-center gap-2">
        <svg class="h-4 w-4 text-[#c79a55]" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 11h16v8H4v-8Zm2-5h12a2 2 0 0 1 2 2v3H4V8a2 2 0 0 1 2-2Zm1 8h4m2 0h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        {{ bedroomsLabel(property()) }}
      </span>
      <span class="flex items-center gap-2">
        <svg class="h-4 w-4 text-[#c79a55]" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 10h13v3a5 5 0 0 1-5 5h-3a5 5 0 0 1-5-5v-3Zm0 0V6a2 2 0 0 1 2-2h1m3 14v2m5-2 1.5 2M8 18 6.5 20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        {{ bathroomsLabel(property()) }}
      </span>
      <span class="flex items-center gap-2">
        <svg class="h-4 w-4 text-[#c79a55]" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M8 4H4v4m0 8v4h4m8 0h4v-4m0-8V4h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        {{ property().surface }} m²
      </span>
    </div>
  </div>
</article>
