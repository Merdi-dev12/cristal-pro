<header 
  [class]="'fixed top-0 left-0 right-0 z-50 w-full transition-all duration-500 ' + 
  (isScrolled() 
    ? 'bg-black/45 py-3 shadow-[0_8px_32px_0_rgba(0,0,0,0.3)] backdrop-blur-md border-b border-white/10' 
    : 'bg-transparent py-5')"
>
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    
    <!-- Logo -->
    <a routerLink="/" class="flex shrink-0 items-center gap-2">
      <span class="text-2xl font-extrabold tracking-tight text-white transition-transform duration-300 hover:scale-105">
        RHEODYCE
      </span>
    </a>

    <!-- Navigation Principale -->
    <nav [class]="'hidden lg:flex items-center transition-all duration-500 ' + 
      (isScrolled() 
        ? 'bg-transparent px-0 py-0 border-none shadow-none' 
        : 'rounded-full border border-white/10 bg-white/10 px-1.5 py-1.5 shadow-[0_4px_30px_rgba(0,0,0,0.03)] backdrop-blur-md')"
    >
      <ul class="flex items-center gap-1">
        @for (link of navLinks(); track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="bg-white !text-black font-semibold shadow-sm"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              class="rounded-full px-4 py-1.5 text-sm font-medium text-white/90 transition-all duration-300 ease-out hover:bg-white/10 hover:text-white"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Boutons d'Action (Authentification) -->
    <div class="flex items-center gap-3">
      <!-- Bouton Se Connecter Épuré -->
      <a
        routerLink="/connexion"
        class="rounded-full border border-white/15 bg-transparent px-5 py-2.5 text-sm font-medium text-white transition-all duration-300 hover:bg-white/10 hover:border-white/30 active:scale-95"
      >
        Se connecter
      </a>
      
      <!-- Bouton S'inscrire -->
      <a
        routerLink="/inscription"
        class="rounded-full bg-[#b2f37e] px-5 py-2.5 text-sm font-semibold text-black transition-all duration-300 hover:bg-[#a1e26d] hover:shadow-[0_0_20px_rgba(178,243,126,0.25)] active:scale-95"
      >
        S'inscrire
      </a>
    </div>

  </div>
</header>
