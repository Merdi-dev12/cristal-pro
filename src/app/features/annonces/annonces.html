<section class="bg-rheo-bg pb-16 pt-28">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <header class="grid gap-8 lg:grid-cols-[0.95fr_1.05fr] lg:items-end">
          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.22em] text-rheo-muted">Catalogue</p>
            <h1 class="mt-3 text-5xl font-semibold tracking-tight text-rheo-dark">Annonces vérifiées</h1>
            <p class="mt-4 max-w-2xl text-sm leading-7 text-rheo-muted">
              Données fake aujourd’hui, structure prête pour l’API demain : filtre par opération, ville,
              budget et typologie.
            </p>
          </div>

          <div class="rounded-[24px] border border-rheo-border bg-white p-4 shadow-sm">
            <div class="grid gap-3 sm:grid-cols-3">
              <button
                type="button"
                class="rounded-full border px-4 py-3 text-sm font-semibold transition"
                [class]="selectedType() === 'all' ? 'border-black bg-black text-white' : 'border-rheo-border bg-white text-rheo-muted hover:text-rheo-dark'"
                (click)="selectedType.set('all')"
              >
                Tous
              </button>
              @for (chip of chips; track chip.type) {
                <button
                  type="button"
                  class="rounded-full border px-4 py-3 text-sm font-semibold transition"
                  [class]="selectedType() === chip.type ? 'border-black bg-black text-white' : 'border-rheo-border bg-white text-rheo-muted hover:text-rheo-dark'"
                  (click)="selectedType.set(chip.type)"
                >
                  {{ chip.label }}
                </button>
              }
            </div>
          </div>
        </header>

        <div class="mt-10 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
          @for (property of filtered(); track property.id) {
            <app-property-card [property]="property" (viewDetails)="onViewDetails($event)" />
          }
        </div>
      </div>
    </section>
