<section class="bg-rheo-bg pb-16 pt-28">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <header class="border-b border-rheo-border pb-8">
      <div class="grid gap-8 lg:grid-cols-[1fr_auto] lg:items-end">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.22em] text-rheo-muted">Catalogue</p>
          <h1 class="mt-3 max-w-3xl text-4xl font-semibold tracking-tight text-rheo-dark sm:text-5xl">
            Des annonces nettes, triées pour décider plus vite.
          </h1>
          <p class="mt-4 max-w-2xl text-sm leading-7 text-rheo-muted">
            Parcourez les biens disponibles avec une lecture simple du prix, de la ville et des informations
            essentielles avant de passer à la visite.
          </p>
        </div>

        <div class="rounded-[22px] border border-rheo-border bg-white p-1.5">
          <div class="grid gap-1.5 sm:grid-cols-3">
            <button
              type="button"
              class="rounded-[16px] px-5 py-3 text-sm font-semibold transition"
              [class]="selectedType() === 'all' ? 'bg-black text-white' : 'bg-white text-rheo-muted hover:bg-rheo-bg hover:text-rheo-dark'"
              (click)="selectedType.set('all')"
            >
              Tous
            </button>
            @for (chip of chips; track chip.type) {
              <button
                type="button"
                class="rounded-[16px] px-5 py-3 text-sm font-semibold transition"
                [class]="selectedType() === chip.type ? 'bg-black text-white' : 'bg-white text-rheo-muted hover:bg-rheo-bg hover:text-rheo-dark'"
                (click)="selectedType.set(chip.type)"
              >
                {{ chip.label }}
              </button>
            }
          </div>
        </div>
      </div>
    </header>

    <div class="mt-10 grid grid-cols-1 gap-x-5 gap-y-8 sm:grid-cols-2 lg:grid-cols-4">
      @for (property of filtered(); track property.id) {
        <app-property-card [property]="property" (viewDetails)="onViewDetails($event)" />
      }
    </div>
  </div>
</section>
