<section id="services" class="relative isolate scroll-mt-24 overflow-hidden bg-gradient-to-br from-[#fbfeff] via-[#f2fcfd] to-[#eaf8fa] py-14 sm:py-18 lg:py-20">
  <div class="pointer-events-none absolute -bottom-40 -left-32 size-[420px] rounded-full bg-[#d9f5f8]/70 blur-3xl"></div>
  <div class="pointer-events-none absolute -right-28 -top-32 size-[360px] rounded-full bg-white/80 blur-3xl"></div>

  <div class="relative mx-auto grid max-w-7xl gap-10 px-4 sm:px-6 lg:min-h-[560px] lg:grid-cols-[0.92fr_1.15fr] lg:items-center lg:gap-10 lg:px-8 xl:min-h-[590px]">
    <div class="relative z-10 max-w-[560px]">
      <p class="inline-flex rounded-full border border-[#cfe3e7] bg-white/80 px-3 py-1.5 text-xs font-semibold uppercase tracking-wide text-[#4e6c72]">Cristal Pro · Île-de-France</p>
      <h2 class="mt-5 max-w-[560px] font-sans text-4xl font-semibold leading-tight tracking-tight text-rheo-dark sm:text-5xl">
        Nos services <span class="text-[#087f8c]">pour vos espaces</span>
      </h2>
      <p class="mt-6 max-w-[540px] text-base leading-7 text-rheo-muted sm:text-lg">
        Des prestations professionnelles, régulières ou ponctuelles, adaptées à vos locaux, à vos horaires et aux besoins de votre activité.
      </p>

      <div class="mt-8 flex flex-wrap items-center gap-x-8 gap-y-5">
        <div class="flex items-center gap-3">
          <span class="grid size-10 shrink-0 place-items-center rounded-full bg-[#dff5f7] text-[#087f8c]" aria-hidden="true">
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.6 2.9 8.1 7 10 4.1-1.9 7-5.4 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
          </span>
          <p class="text-xs font-bold uppercase leading-4 tracking-wide text-rheo-dark">Qualité <span class="block">soignée</span></p>
        </div>
        <div class="flex items-center gap-3">
          <span class="grid size-10 shrink-0 place-items-center rounded-full bg-[#dff5f7] text-[#087f8c]" aria-hidden="true">
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </span>
          <p class="text-xs font-bold uppercase leading-4 tracking-wide text-rheo-dark">À votre <span class="block">rythme</span></p>
        </div>
      </div>

      <div class="mt-9 flex flex-wrap items-center gap-3">
        <a href="/devis" class="group inline-flex h-11 items-center justify-center gap-2.5 rounded-full bg-[#44CEE9] px-6 text-sm font-bold text-white transition duration-300 hover:bg-[#20B5D2]">
          Demander un devis
          <svg class="size-4 transition-transform duration-200 group-hover:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
        <a href="#services-showcase" class="inline-flex h-11 items-center justify-center rounded-full border border-[#b7cacc] bg-white/60 px-7 text-sm font-bold text-rheo-dark transition hover:bg-white">Nos prestations</a>
      </div>
    </div>

    <app-services-showcase id="services-showcase" [services]="displayedServices()" [autoplayDelay]="autoplayDelay()" />
  </div>
</section>
